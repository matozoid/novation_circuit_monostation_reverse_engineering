# Let the 'p' 0x40 op 2 read (normally external SPI flash only) read MCU memory,
# so the bootloader at 0x08000000-0x0800BFFF can be dumped with tools/p40dump.py.
# External flash ends at 0x800000, so every MCU range below lies above it.
# v803 adds DBGMCU_IDCODE and SRAM3 (0x20020000-0x2002FFFF) and reads aligned words.
base = 800
version = 803
sources = ["memread.s"]

[functions]
fw_spi_read = 0x0801C0EC     # (address, destination, length): starts the SPI fast read

[[hook]]
at = 0x0802066A              # 'p' 0x40 op 2: bl fw_spi_read(address, reply + 10, 0x100)
kind = "bl"
target = "p40_read"
expect = "fb f7 3f fd"
