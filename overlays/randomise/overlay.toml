# #13 Randomise gate, glide, velocity and pitch: Mutate (Shift + Pattern Settings) in the
# Velocity, Gate, Glide or Expand view of the Osc 1 or Osc 2 track gives each step with a
# note a random value for that field only (Expand: a note from its pads). In every other
# view, and on the mod-seq track, Mutate stays stock and shuffles whole steps.
# #45 Patch randomiser: Mutate in the Patches view gives the current patch random but
# playable settings, as if the knobs had been turned.
base = 800
# Below 800 (firmware 1.2) and above 745 (1.1), so Components offers to restore stock 1.2.
version = 750
sources = ["randomise.c"]
replace = ["ui_button_event"]
